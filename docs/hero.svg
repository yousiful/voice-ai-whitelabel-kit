<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1200 340" width="1200" height="340" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#141b33"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffd54a"/>
    </marker>
  </defs>

  <rect width="1200" height="340" rx="22" fill="url(#bg)"/>

  <text x="600" y="48" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="700">Resell voice AI under your own brand and get paid twice.</text>
  <text x="600" y="78" text-anchor="middle" fill="#8f9bc4" font-size="16">A license fee every month, plus a markup on every minute, text and number.</text>

  <!-- Panel 1: license fee -->
  <rect x="60" y="104" width="230" height="168" rx="16" fill="#1b2442" stroke="#2c3866" stroke-width="1.5"/>
  <text x="175" y="136" text-anchor="middle" fill="#ffd54a" font-size="14" font-weight="700">INCOME 1</text>
  <text x="175" y="188" text-anchor="middle" fill="#ffffff" font-size="40" font-weight="800">$497</text>
  <text x="175" y="228" text-anchor="middle" fill="#c9d1e8" font-size="16">White label fee</text>
  <text x="175" y="252" text-anchor="middle" fill="#8f9bc4" font-size="13">per month (example)</text>

  <text x="340" y="196" text-anchor="middle" fill="#ffd54a" font-size="40" font-weight="800">+</text>

  <!-- Panel 2: markup -->
  <rect x="385" y="104" width="230" height="168" rx="16" fill="#1b2442" stroke="#2c3866" stroke-width="1.5"/>
  <text x="500" y="136" text-anchor="middle" fill="#ffd54a" font-size="14" font-weight="700">INCOME 2</text>
  <text x="500" y="188" text-anchor="middle" fill="#ffffff" font-size="40" font-weight="800">2.2x</text>
  <text x="500" y="228" text-anchor="middle" fill="#c9d1e8" font-size="16">Usage markup</text>
  <text x="500" y="252" text-anchor="middle" fill="#8f9bc4" font-size="13">prepaid credits (example)</text>

  <line x1="625" y1="188" x2="708" y2="188" stroke="#ffd54a" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Panel 3: result -->
  <rect x="714" y="104" width="230" height="168" rx="16" fill="#1a3a26" stroke="#44cc77" stroke-width="1.5"/>
  <text x="829" y="136" text-anchor="middle" fill="#44cc77" font-size="14" font-weight="700">MONTHLY MARGIN</text>
  <text x="829" y="188" text-anchor="middle" fill="#44cc77" font-size="40" font-weight="800">$1,038</text>
  <text x="829" y="228" text-anchor="middle" fill="#c9d1e8" font-size="16">12 sub-accounts</text>
  <text x="829" y="252" text-anchor="middle" fill="#8f9bc4" font-size="13">53% margin (example)</text>

  <!-- Panel 4: agreement -->
  <rect x="980" y="104" width="160" height="168" rx="16" fill="#1b2442" stroke="#2c3866" stroke-width="1.5"/>
  <text x="1060" y="136" text-anchor="middle" fill="#ffd54a" font-size="14" font-weight="700">PROTECTED BY</text>
  <rect x="1020" y="150" width="80" height="60" rx="8" fill="#0d1527" stroke="#ffd54a"/>
  <line x1="1034" y1="168" x2="1086" y2="168" stroke="#8f9bc4" stroke-width="3"/>
  <line x1="1034" y1="182" x2="1086" y2="182" stroke="#8f9bc4" stroke-width="3"/>
  <line x1="1034" y1="196" x2="1066" y2="196" stroke="#8f9bc4" stroke-width="3"/>
  <text x="1060" y="238" text-anchor="middle" fill="#c9d1e8" font-size="14">Agreement</text>
  <text x="1060" y="258" text-anchor="middle" fill="#8f9bc4" font-size="12">template</text>

  <rect x="60" y="288" width="1080" height="36" rx="8" fill="#0d1527"/>
  <text x="600" y="312" text-anchor="middle" fill="#8f9bc4" font-size="14" font-family="Consolas, Courier New, monospace">python calculator/margin.py deal.json   |   python agreement/fill.py agreement.md deal.json &gt; out.md</text>
</svg>
